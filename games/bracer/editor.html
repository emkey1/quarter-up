<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bracer — Level Editor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0a0b10; color: #d7dbe0;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app { display: grid; grid-template-columns: 220px 1fr 260px; height: 100%; }
      .pane { overflow-y: auto; padding: 14px; }
      #left { border-right: 1px solid rgba(255,255,255,.08); }
      #right { border-left: 1px solid rgba(255,255,255,.08); }
      #centre { display: grid; place-items: center; background: #06070b; position: relative; }
      canvas { image-rendering: pixelated; cursor: crosshair; }
      h2 {
        font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: rgba(215,219,224,.4); margin: 18px 0 8px; font-weight: 600;
      }
      h2:first-child { margin-top: 0; }
      .tool {
        display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px;
        background: transparent; border: 1px solid transparent; border-radius: 4px;
        color: #d7dbe0; font: inherit; text-align: left; cursor: pointer;
      }
      .tool:hover { background: rgba(255,255,255,.05); }
      .tool.on { background: rgba(255,215,106,.14); border-color: rgba(255,215,106,.5); }
      .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.5); }
      .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
      label { color: rgba(215,219,224,.55); min-width: 62px; font-size: 12px; }
      input, select {
        background: #14161d; color: #d7dbe0; border: 1px solid rgba(255,255,255,.12);
        border-radius: 4px; padding: 4px 6px; font: inherit; width: 100%;
      }
      button.act {
        width: 100%; padding: 8px; margin-top: 6px; border-radius: 5px; cursor: pointer;
        background: #1d2029; color: #d7dbe0; border: 1px solid rgba(255,255,255,.14);
        font: inherit; font-weight: 600;
      }
      button.act:hover { background: #262a35; }
      button.act.primary { background: #2f6b3c; border-color: #3f8b4c; }
      #status { font-size: 12px; white-space: pre-wrap; }
      .ok { color: #4fbf5f; }
      .bad { color: #ff6b5e; }
      .warn { color: #e8c34a; }
      #hint {
        position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: rgba(215,219,224,.4);
      }
      textarea {
        width: 100%; height: 130px; background: #14161d; color: #9fb0c0;
        border: 1px solid rgba(255,255,255,.12); border-radius: 4px;
        font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="pane" id="left"></div>
      <div id="centre"><canvas id="grid"></canvas><div id="hint"></div></div>
      <div class="pane" id="right"></div>
    </div>
    <script type="module" src="/tools/editor/main.ts"></script>
  </body>
</html>
